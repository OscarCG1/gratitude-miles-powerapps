                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        LayoutMaxHeight: =0
                        LayoutMaxWidth: =0
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =22
                        Text: ="Gratitud miles"
